name: CI

on:
  push:
    branches: [feature/multi-program-compliance-platform, main]
  pull_request:
    branches: [feature/multi-program-compliance-platform, main]

jobs:
  quality-gate:
    name: Prohibited-reference scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Scan current tracked files for prohibited automated-generation-tool references
        run: bash scripts/scan-prohibited-references.sh

  build:
    name: Install, audit, build
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (locked versions only)
        run: npm ci
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      - name: Production build (must succeed with zero public-network access at runtime)
        run: npm run build
      - name: Verify no known public CDN hostname survives in the build output
        # A blanket URL sweep is too noisy for CI (it flags benign strings
        # like Vue's own runtime-error documentation links or a placeholder
        # API domain) — see docs/offline-assets.md for the full manual CDN
        # audit. This check targets specific, known CDN hosts that would
        # indicate a real reintroduced public-network dependency.
        run: |
          CDN_HOSTS='fonts\.googleapis\.com|fonts\.gstatic\.com|cdn\.jsdelivr\.net|unpkg\.com|cdnjs\.cloudflare\.com|ajax\.googleapis\.com|fonts\.bunny\.net|cdn\.tailwindcss\.com'
          if grep -rEoq "$CDN_HOSTS" dist/ 2>/dev/null; then
            echo "A known public CDN hostname was found in the production build output:"
            grep -rEo "$CDN_HOSTS" dist/
            exit 1
          fi
          echo "No known public CDN hostnames found in the build output."
